<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PataKeja Admin</title>
<style>
:root{--bg:#f7faf7;--card:#fff;--tx:#17301f;--mut:#5d7164;--g:#1f9d55;--o:#d9730d;--bd:#dce6de;--r:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#101a14;--card:#18261d;--tx:#e8f3ea;--mut:#9ab0a1;--bd:#2a3d31}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.w{max-width:900px;margin:0 auto;padding:14px}
button,input{font:inherit}input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:6px 0}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;margin:3px 3px 0 0}
.btn.o{background:var(--o)}.btn.r{background:var(--r)}.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;cursor:pointer;border-radius:10px;margin-right:6px}.tabs .on{background:var(--g);color:#fff}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.ph{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.ph a{flex:0 0 120px;height:90px;border-radius:8px;background:center/cover}
.mut{color:var(--mut);font-size:13px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 14px}
#msg{color:var(--r)}
.vf{display:inline-block;background:#1d9bf0;color:#fff;font-weight:700;font-size:11px;padding:2px 8px;border-radius:20px;vertical-align:middle}
</style>
</head>
<body>
<header><b>PataKeja Admin</b><button class="btn alt" id="out" style="display:none">Log out</button></header>
<div class="w">
<div id="login">
  <h3>Admin login</h3>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="go">Log in</button> <span id="msg"></span>
</div>
<div id="app" style="display:none">
  <div class="stats" id="stats"></div><h3>Visitor statistics</h3><button class="btn alt" id="refreshAnalytics">Refresh statistics</button><div class="stats" id="analytics" aria-live="polite">Loading statistics…</div>
  <div class="tabs"><button data-t="pending" class="on">Pending</button><button data-t="live">Live</button><button data-t="reports">Reports</button><button data-t="old">Taken / rejected</button></div>
  <div id="rows"></div><hr><h2>Service providers & safety</h2><button class="btn alt" id="refreshServices">Refresh service applications</button><div id="service-admin" aria-live="polite"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var CFG=window.PK_CONFIG,$=function(i){return document.getElementById(i)};
var sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY),tab="pending",ALL=[],REP=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return "KSh "+Number(n).toLocaleString("en-KE")}
async function start(){
  var s=await sb.auth.getSession();
  if(s.data.session){$("login").style.display="none";$("app").style.display="block";$("out").style.display="inline-block";load()}
  else{$("login").style.display="block";$("app").style.display="none";$("out").style.display="none"}
}
$("go").onclick=async function(){
  var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(r.error)$("msg").textContent="Wrong email or password.";else start()
};
$("out").onclick=async function(){await sb.auth.signOut();start()};
document.querySelector(".tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(function(x){x.className=x===b?"on":""});draw()};
async function load(){
  var a=await sb.from("listings").select("*").order("created_at",{ascending:false}).limit(1000);
  var r=await sb.from("reports").select("*").eq("resolved",false).order("created_at",{ascending:false});
  ALL=a.data||[];REP=r.data||[];
  try{var c=await sb.rpc('pk_admin_listing_counts');if(!c.error&&c.data){var m={};c.data.forEach(function(x){m[x.id]=x});ALL.forEach(function(x){if(m[x.id]){x.views=Number(m[x.id].views);x.pk_contacts=Number(m[x.id].contacts)}})}}catch(e){}
  draw();loadAnalytics()
}
async function loadAnalytics(){
  try{var r=await sb.rpc('pk_admin_stats');if(r.error)throw r.error;
  var s=r.data;$("analytics").innerHTML=[['Website visits',s.visits],['Estimated unique browsers',s.visitors],['Visits today',s.today],['Visits in last 7 days',s.week],['Tracked advert opens',s.views],['Contact reveals',s.contacts]].map(function(x){return '<div>'+x[0]+': <b>'+Number(x[1]).toLocaleString('en-KE')+'</b></div>'}).join('');
  }catch(e){$("analytics").textContent='Statistics unavailable. Run analytics.sql and register your admin user ID as described in SETUP.txt.'}
}
$("refreshAnalytics").onclick=loadAnalytics;
function cnt(s){return ALL.filter(function(x){return x.status==s}).length}
function draw(){
  var v=ALL.reduce(function(t,x){return t+(x.views||0)},0);
  $("stats").innerHTML='<div>Pending: <b>'+cnt("pending")+'</b></div><div>Live: <b>'+cnt("live")+'</b></div><div>Taken: <b>'+cnt("taken")+'</b></div><div>Open reports: <b>'+REP.length+'</b></div><div>Total views: <b>'+v+'</b></div>';
  var h="";
  if(tab=="reports"){
    h=REP.length?REP.map(function(r){var l=ALL.filter(function(x){return x.id==r.listing_id})[0];
      return '<div class="item"><b>'+esc(r.reason)+'</b><div class="mut">'+new Date(r.created_at).toLocaleString()+'</div>'+(l?'<div>'+esc(l.category)+' · '+esc(l.plot_name)+', '+esc(l.estate)+', '+esc(l.town||'Nairobi')+' · '+esc(l.contact_phone)+' ('+l.status+')</div><button class="btn r" data-a="takedown" data-id="'+l.id+'" data-rep="'+r.id+'">Take down listing</button>':'')+'<button class="btn alt" data-a="resolve" data-rep="'+r.id+'">Dismiss report</button></div>'}).join(""):'<p class="mut">No open reports.</p>'
  }else{
    var f=ALL.filter(function(x){return tab=="old"?(x.status=="taken"||x.status=="rejected"):x.status==tab});
    h=f.length?f.map(function(x){
      var exp=x.expires_at?' · expires '+new Date(x.expires_at).toLocaleDateString():'';
      var btns=x.status=="pending"?'<button class="btn" data-a="approve" data-id="'+x.id+'">Approve</button><button class="btn r" data-a="reject" data-id="'+x.id+'">Reject</button>':
        x.status=="live"?'<button class="btn o" data-a="verify" data-id="'+x.id+'">'+(x.verified?"Remove blue badge":"I visited: add blue badge")+'</button><button class="btn alt" data-a="taken" data-id="'+x.id+'">Mark taken</button><button class="btn alt" data-a="renew" data-id="'+x.id+'">Renew 30 days</button>':
        '<button class="btn alt" data-a="approve" data-id="'+x.id+'">Re-publish</button>';
      return '<div class="item"><b>'+money(x.rent)+(String(x.category).indexOf('Short stay')==0?' /night':'')+'</b> · '+esc(x.category)+' · '+esc(x.plot_name)+', '+esc(x.estate)+', '+esc(x.town||'Nairobi')+(x.verified?' <span class="vf">✔ Verified</span>':'')+'<div class="mut">'+esc(x.landmark||"")+' · Deposit '+money(x.deposit||x.rent)+exp+' · '+(x.views||0)+' views · '+(x.pk_contacts||0)+' contact reveals</div><div>'+esc(x.description||"")+'</div><div class="mut">'+esc(x.amenities.join(", "))+'</div><div><b>'+esc(x.contact_name||"")+'</b> ('+esc(x.contact_role||"")+') <a href="tel:'+esc(x.contact_phone)+'">'+esc(x.contact_phone)+'</a>'+(x.lat?' · <a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+x.lat+','+x.lng+'">map</a>':' · <span class="mut">no GPS</span>')+'</div><div class="ph">'+x.photos.map(function(u){return '<a target="_blank" rel="noopener" href="'+esc(u)+'" style="background-image:url(\''+esc(u)+'\')"></a>'}).join("")+'</div>'+btns+'<button class="btn r" data-a="delete" data-id="'+x.id+'">Delete</button></div>'
    }).join(""):'<p class="mut">Nothing here.</p>'
  }
  $("rows").innerHTML=h
}
$("rows").onclick=async function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;
  var a=b.dataset.a,id=b.dataset.id,res,day=864e5,iso=function(d){return new Date(Date.now()+d).toISOString()};
  b.disabled=true;
  if(a=="approve")res=await sb.from("listings").update({status:"live",approved_at:iso(0),expires_at:iso(30*day)}).eq("id",id);
  else if(a=="renew")res=await sb.from("listings").update({expires_at:iso(30*day)}).eq("id",id);
  else if(a=="reject")res=await sb.from("listings").update({status:"rejected"}).eq("id",id);
  else if(a=="taken"||a=="takedown")res=await sb.from("listings").update({status:"taken"}).eq("id",id);
  else if(a=="verify"){var x=ALL.filter(function(y){return y.id==id})[0];if(!x.verified&&!confirm("Give the blue badge only after you have visited this property in person. Continue?")){b.disabled=false;return}res=await sb.from("listings").update({verified:!x.verified}).eq("id",id)}
  else if(a=="delete"){if(!confirm("Delete this listing for good?")){b.disabled=false;return}res=await sb.from("listings").delete().eq("id",id)}
  if(a=="takedown"||a=="resolve")await sb.from("reports").update({resolved:true}).eq("id",b.dataset.rep);
  if(res&&res.error)alert("Failed: "+res.error.message);
  load()
};
start();
</script>
<script>
(function(){
 var box=document.getElementById('service-admin'),data;
 async function call(n,a){var r=await sb.rpc(n,a||{});if(r.error)throw Error(r.error.message);return r.data}
 function button(id,action,text){return '<button class="btn alt" data-sm-id="'+esc(id)+'" data-sm-action="'+action+'">'+text+'</button>'}
 function shortId(id){return String(id).slice(0,8)}
 async function refresh(){
  box.innerHTML='<p class="mut">Loading service providers…</p>';
  try{data=await call('pk_services_admin_data');drawServices()}catch(e){box.textContent='Services unavailable: '+e.message}
 }
 function drawServices(){
  var pending=data.providers.filter(function(p){return p.status==='pending'}).length;
  box.innerHTML='<div class="stats"><div>Pending providers: <b>'+pending+'</b></div><div>Open service reports: <b>'+data.reports.length+'</b></div></div><p class="mut">Approval publishes the business profile and phone. Add check badges only after you have completed the stated check.</p><h3>Provider applications</h3>'+(data.providers.length?data.providers.map(function(p){return '<article class="item"><b>'+esc(p.name)+'</b> · '+esc(p.category)+'<div class="mut">'+esc(p.status)+' · '+(p.paused?'Paused · ':'')+esc(p.town)+' · '+esc(p.areas.join(', '))+'</div><p>'+esc(p.description)+'</p><p>'+esc(p.price_note)+' · '+esc(p.availability)+'</p><p>Business phone: '+esc(p.phone)+'<br>Owner ID: '+esc(p.owner_id)+'<br>Checks: '+(p.phone_checked?'phone checked':'phone not checked')+'; '+(p.identity_checked?'identity checked':'identity not checked')+'</p>'+button(p.id,'approve','Approve / restore')+button(p.id,'reject','Reject')+button(p.id,'suspend','Suspend')+button(p.id,'phone_checked','I checked this phone')+button(p.id,'identity_checked','I checked identity')+button(p.id,'clear_checks','Remove check badges')+'</article>'}).join(''):'<p class="mut">No provider applications yet.</p>')+'<h3>Service reports</h3>'+(data.reports.length?data.reports.map(function(r){var p=data.providers.find(function(p){return p.id===r.provider_id});return '<article class="item"><b>'+esc(p?p.name:r.provider_id)+'</b><p>'+esc(r.reason)+'</p><p class="mut">Reporter: '+esc(r.reporter_id)+' · '+esc(new Date(r.created_at).toLocaleString())+'</p>'+button(r.id,'resolve_report','Resolve report')+button(r.provider_id,'suspend','Suspend provider')+'</article>'}).join(''):'<p class="mut">No open service reports.</p>')+'<details><summary>Recent reviews — moderation</summary>'+data.reviews.map(function(r){return '<article class="item"><b>'+Number(r.rating)+' / 5 · '+(r.hidden?'Hidden':'Visible')+'</b><p>'+esc(r.body)+'</p><div class="mut">Provider '+esc(shortId(r.provider_id))+' · Booking '+esc(shortId(r.booking_id))+'</div>'+button(r.id,r.hidden?'restore_review':'hide_review',r.hidden?'Restore review':'Hide review')+'</article>'}).join('')+'</details><details><summary>Recent service activity log</summary>'+data.audit.map(function(a){return '<div class="item"><b>'+esc(a.action)+'</b> · '+esc(new Date(a.created_at).toLocaleString())+'<div class="mut">Actor '+esc(a.actor_id)+' · Record '+esc(a.entity_id)+'</div><p>'+esc(a.note)+'</p></div>'}).join('')+'</details>';
 }
 box.onclick=async function(e){var b=e.target.closest('[data-sm-action]');if(!b)return;
  var action=b.dataset.smAction;
  var instructions=action==='identity_checked'?'Describe the identity evidence you checked. Do not enter an ID number.':action==='phone_checked'?'Describe how and when you contacted this phone number.':'Explain this moderation decision (5–500 characters).';
  var note=prompt(instructions);if(note===null)return;if(note.trim().length<5){alert('Please add a note of at least 5 characters.');return}
  b.disabled=true;try{await call('pk_services_moderate',{p_id:b.dataset.smId,p_action:action,p_note:note.trim()});await refresh()}catch(err){alert(err.message);b.disabled=false}
 };
 document.getElementById('refreshServices').onclick=refresh;
 // Show the service panel after a session is restored or login completes.
 sb.auth.onAuthStateChange(function(event,session){if(session)setTimeout(refresh,0);else box.textContent='Sign in as an authorised admin to manage service providers.'});
 sb.auth.getSession().then(function(r){if(r.data.session)refresh()});
})();

</script>
</body>
</html>
